name: song-stadium

services:
  redis:
    build:
      context: ./backend
      dockerfile: dockerfile
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  redis-data:
